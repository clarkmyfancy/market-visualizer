<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MarketLens data flow</title>
  <desc id="desc">A simplified architecture flow diagram from UI to data providers and back.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1b1b1b" />
    </marker>
    <style>
      .box { fill: #f7f7f7; stroke: #1b1b1b; stroke-width: 3; rx: 0; }
      .label { font: 800 18px "Arial", sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #1b1b1b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .group { font: 700 12px "Arial", sans-serif; fill: #444; }
      .bg { fill: #e9e9e9; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="430"/>

  <text class="group" x="70" y="70">Frontend</text>
  <text class="group" x="920" y="70">Backend / External</text>
  <text class="group" x="515" y="335">Render + State Loop</text>

  <rect class="box" x="40" y="90" width="130" height="56"/>
  <text class="label" x="105" y="118">UI</text>

  <rect class="box" x="205" y="90" width="150" height="56"/>
  <text class="label" x="280" y="118">Facade</text>

  <rect class="box" x="390" y="90" width="160" height="56"/>
  <text class="label" x="470" y="118">Use Cases</text>

  <rect class="box" x="585" y="90" width="120" height="56"/>
  <text class="label" x="645" y="118">Ports</text>

  <rect class="box" x="740" y="90" width="140" height="56"/>
  <text class="label" x="810" y="118">Adapters</text>

  <rect class="box" x="915" y="90" width="120" height="56"/>
  <text class="label" x="975" y="118">Data</text>

  <rect class="box" x="1070" y="90" width="90" height="56"/>
  <text class="label" x="1115" y="118">API</text>

  <rect class="box" x="1000" y="185" width="160" height="56"/>
  <text class="label" x="1080" y="213">Providers</text>

  <rect class="box" x="285" y="265" width="120" height="56"/>
  <text class="label" x="345" y="293">State</text>

  <rect class="box" x="435" y="265" width="120" height="56"/>
  <text class="label" x="495" y="293">D3</text>

  <line class="line" x1="170" y1="118" x2="205" y2="118"/>
  <line class="line" x1="355" y1="118" x2="390" y2="118"/>
  <line class="line" x1="550" y1="118" x2="585" y2="118"/>
  <line class="line" x1="705" y1="118" x2="740" y2="118"/>
  <line class="line" x1="880" y1="118" x2="915" y2="118"/>
  <line class="line" x1="1035" y1="118" x2="1070" y2="118"/>

  <line class="line" x1="1115" y1="146" x2="1115" y2="185"/>
  <line class="line" x1="1000" y1="213" x2="975" y2="213"/>
  <line class="line" x1="915" y1="213" x2="395" y2="213"/>
  <line class="line" x1="345" y1="213" x2="345" y2="265"/>

  <line class="line" x1="405" y1="293" x2="435" y2="293"/>
  <line class="line" x1="495" y1="265" x2="495" y2="200"/>
  <line class="line" x1="495" y1="200" x2="140" y2="200"/>
  <line class="line" x1="140" y1="200" x2="140" y2="146"/>
</svg>
