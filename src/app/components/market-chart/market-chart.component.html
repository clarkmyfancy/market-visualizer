<div class="chart">
  <div class="chart-top">
    <div class="chart-title">
      <span class="label">{{ headerLabel() }}</span>
      <span class="value">{{ headerValue() }}</span>
    </div>

    <div class="range" role="tablist" aria-label="Time range">
      @for (r of ranges; track r.value) {
        <button
          type="button"
          class="range-btn"
          role="tab"
          (click)="setRange(r.value)"
          [style.--accent-color]="marketService.selectedAsset()?.color ?? '#3b82f6'"
          [disabled]="isRangeDisabled(r.value)"
          [attr.aria-disabled]="isRangeDisabled(r.value)"
          [attr.title]="
            isRangeDisabled(r.value)
              ? 'Not available for real estate pricing'
              : null
          "
          [class.active]="marketService.range() === r.value">
          {{ r.label }}
        </button>
      }
    </div>
  </div>

  <div class="chart-viewport">
    <div class="overlay" [class.visible]="marketService.isLoading()">Loading…</div>
    <div class="overlay error" [class.visible]="!!marketService.error()">
      {{ marketService.error() }}
    </div>

    <div #chartContainer class="svg-host"></div>
  </div>
</div>
